<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelola Galeri — Admin Teduh Residence</title>
  <meta name="robots" content="noindex, nofollow" />
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../img/logo/favicon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/custom.css" />
</head>
<body>

<!-- SIDEBAR -->
<aside class="admin-sidebar d-none d-lg-flex flex-column">
  <a href="../index.html" class="brand d-flex align-items-center gap-2" target="_blank" rel="noopener">
    <img src="../img/logo/favicon.png" alt="Teduh Residence Logo" style="height:24px;width:auto;" />
    <span>Teduh Residence</span>
  </a>
  <nav class="flex-grow-1">
    <a href="index.html" class="nav-link"><i class="bi bi-calendar-check"></i>Booking</a>
    <a href="kamar.html" class="nav-link"><i class="bi bi-door-open"></i>Kamar</a>
    <a href="galeri.html" class="nav-link active"><i class="bi bi-images"></i>Galeri</a>
  </nav>
  <button id="logout-btn" class="nav-link text-start border-0 bg-transparent w-100" style="color:var(--teal-300);font-size:.9rem;padding:.6rem .75rem;cursor:pointer;">
    <i class="bi bi-box-arrow-left me-2"></i>Keluar
  </button>
</aside>

<!-- MAIN -->
<main class="admin-main">
  <div class="admin-topbar">
    <div>
      <h5 class="mb-0" style="font-size:1rem;">Kelola Galeri Foto</h5>
      <p class="mb-0 text-ink-muted" style="font-size:.8rem;" id="admin-email-display"></p>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary btn-sm" id="add-photo-btn">
        <i class="bi bi-plus-lg me-1"></i>Tambah Foto
      </button>
      <button id="logout-mobile" class="btn btn-outline-primary btn-sm d-lg-none"><i class="bi bi-box-arrow-left"></i></button>
    </div>
  </div>

  <div class="admin-content">

    <!-- FILTER KATEGORI & SEARCH -->
    <div class="d-flex flex-wrap gap-2 mb-4 align-items-center">
      <button class="btn btn-primary btn-sm filter-btn active" data-category="all">Semua Foto</button>
      <button class="btn btn-outline-primary btn-sm filter-btn" data-category="kamar">Kamar</button>
      <button class="btn btn-outline-primary btn-sm filter-btn" data-category="fasilitas">Fasilitas</button>
      <button class="btn btn-outline-primary btn-sm filter-btn" data-category="eksterior">Eksterior & Taman</button>
      <button class="btn btn-outline-primary btn-sm filter-btn" data-category="suasana">Suasana</button>
      <button class="btn btn-outline-primary btn-sm filter-btn" data-category="lainnya">Lainnya</button>
    </div>

    <!-- Grid Galeri -->
    <div class="row g-3" id="gallery-admin-grid">
      <!-- Diisi secara dinamis dari Firestore -->
    </div>

  </div>
</main>

<!-- MODAL TAMBAH/EDIT FOTO GALERI -->
<div class="modal fade" id="photoModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content" style="background:var(--cream-50);border:1px solid var(--cream-300);border-radius:var(--radius-lg);">
      <div class="modal-header" style="border-bottom:1px solid var(--cream-300);">
        <h5 class="modal-title" id="photo-modal-title">Tambah Foto Galeri</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="photo-form" novalidate>
          <input type="hidden" id="photo-doc-id" />
          <div class="row g-3">
            <div class="col-md-7">
              <label class="form-label">Judul / Keterangan Foto *</label>
              <input type="text" class="form-control" id="p-title" required placeholder="Contoh: Kamar Deluxe yang Hangat" />
            </div>
            <div class="col-md-5">
              <label class="form-label">Kategori Foto *</label>
              <select class="form-select" id="p-category" required>
                <option value="kamar">Kamar</option>
                <option value="fasilitas">Fasilitas & Sarapan</option>
                <option value="eksterior">Eksterior & Taman</option>
                <option value="suasana">Suasana & Lobby</option>
                <option value="lainnya">Lainnya</option>
              </select>
            </div>

            <!-- UPLOAD FOTO DARI PERANGKAT -->
            <div class="col-12">
              <label class="form-label d-flex justify-content-between align-items-center mb-1">
                <span class="fw-medium">File Foto *</span>
                <span class="text-ink-muted" style="font-size:0.75rem;">Pilih foto dari perangkat</span>
              </label>

              <!-- Dropzone Area -->
              <div id="dropzone" class="upload-dropzone p-4 text-center border-dashed rounded-3" style="border: 2px dashed var(--cream-300); background: #fff; cursor: pointer; transition: all .2s ease;">
                <input type="file" id="p-file-input" accept="image/*" class="d-none" />
                <i class="bi bi-cloud-arrow-up text-primary" style="font-size: 2.25rem;"></i>
                <div class="mt-2 fw-semibold" style="font-size: 0.95rem;">Klik untuk pilih foto dari perangkat</div>
                <div class="text-ink-muted" style="font-size: 0.8rem;">Mendukung format JPG, PNG, WEBP</div>
              </div>

              <!-- Upload Progress -->
              <div id="upload-progress-box" class="mt-2 d-none">
                <div class="d-flex justify-content-between align-items-center mb-1" style="font-size: 0.8rem;">
                  <span id="upload-status-text" class="text-teal-700 fw-medium">Mengunggah foto...</span>
                  <span id="upload-status-pct" class="text-ink-muted">0%</span>
                </div>
                <div class="progress" style="height: 6px;">
                  <div id="upload-progress-bar" class="progress-bar bg-primary progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;"></div>
                </div>
              </div>

              <!-- Preview Image -->
              <div id="photo-preview-container" class="mt-3 text-center d-none">
                <p class="text-ink-muted mb-1 text-start" style="font-size:0.8rem;">Preview Foto:</p>
                <div style="max-height:220px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--cream-300);background:#000;">
                  <img id="photo-preview-img" src="" alt="Preview" style="max-height:220px;width:auto;max-width:100%;object-fit:contain;" />
                </div>
              </div>

            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer" style="border-top:1px solid var(--cream-300);">
        <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary" id="save-photo-btn">Simpan Foto</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL KONFIRMASI HAPUS -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content" style="background:var(--cream-50);border-radius:var(--radius-lg);border:1px solid var(--cream-300);">
      <div class="modal-body text-center p-4">
        <i class="bi bi-exclamation-triangle" style="font-size:2rem;color:#B08D57;"></i>
        <h5 class="mt-3 mb-2">Hapus foto ini?</h5>
        <p class="text-ink-muted mb-4" style="font-size:.875rem;">Foto <strong id="delete-photo-title"></strong> akan dihapus dari galeri.</p>
        <div class="d-flex gap-2 justify-content-center">
          <button class="btn btn-outline-primary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-primary" id="confirm-delete-btn" style="--bs-btn-bg:#9A3B30;--bs-btn-border-color:#9A3B30;--bs-btn-hover-bg:#7a2e24;--bs-btn-hover-border-color:#7a2e24;">Hapus</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { auth, db, storage } from '../js/firebase.js';
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, orderBy, query, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import {
    ref, uploadBytesResumable, getDownloadURL
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = 'login.html';
    } else {
      document.getElementById('admin-email-display').textContent = user.email;
      loadGallery();
    }
  });

  ['logout-btn', 'logout-mobile'].forEach(id => {
    document.getElementById(id)?.addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = 'login.html');
    });
  });

  const photoModal   = new bootstrap.Modal(document.getElementById('photoModal'));
  const deleteModal  = new bootstrap.Modal(document.getElementById('deleteModal'));
  let allPhotos      = [];
  let currentCategory= 'all';
  let deleteId       = null;
  let uploadedImageUrl = '';

  // ── Load Gallery from Firestore ──
  function loadGallery() {
    const qGallery = query(collection(db, 'gallery'), orderBy('createdAt', 'desc'));
    onSnapshot(qGallery, (snap) => {
      allPhotos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderGallery();
    }, (err) => {
      console.error('Gallery stream error:', err);
    });
  }

  // ── Category labels ──
  const categoryNames = {
    kamar: 'Kamar',
    fasilitas: 'Fasilitas & Sarapan',
    eksterior: 'Eksterior & Taman',
    suasana: 'Suasana',
    lainnya: 'Lainnya'
  };

  // ── Render Gallery Grid ──
  function renderGallery() {
    const grid = document.getElementById('gallery-admin-grid');
    let filtered = allPhotos;

    if (currentCategory !== 'all') {
      filtered = filtered.filter(p => (p.category || '').toLowerCase() === currentCategory);
    }

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="col-12 text-center py-5 text-ink-muted">
          <i class="bi bi-images fs-1 d-block mb-2 text-teal-300"></i>
          Belum ada foto dalam kategori ini. Klik "Tambah Foto" untuk menambahkan.
        </div>`;
      return;
    }

    grid.innerHTML = filtered.map(p => `
      <div class="col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100 shadow-sm overflow-hidden" style="border-radius:var(--radius-md);">
          <div style="aspect-ratio:4/3;overflow:hidden;position:relative;background:#eee;">
            <img src="${p.imageUrl}" alt="${p.title || 'Foto Galeri'}" style="width:100%;height:100%;object-fit:cover;" loading="lazy" />
            <span class="badge bg-dark bg-opacity-75 position-absolute top-0 start-0 m-2" style="font-size:0.7rem;text-transform:capitalize;">
              ${categoryNames[p.category] || p.category || 'Galeri'}
            </span>
          </div>
          <div class="card-body d-flex flex-column p-3">
            <h6 class="mb-2 text-truncate" title="${p.title || 'Tanpa Judul'}" style="font-size:0.9rem;font-weight:600;">
              ${p.title || 'Foto Galeri'}
            </h6>
            <div class="d-flex gap-2 mt-auto pt-2 border-top">
              <button class="btn btn-outline-primary btn-sm flex-grow-1" onclick="editPhoto('${p.id}')">
                <i class="bi bi-pencil me-1"></i>Edit
              </button>
              <button class="btn btn-sm" onclick="deletePhoto('${p.id}', '${(p.title || 'Foto').replace(/'/g, "\\'")}')"
                      style="color:#9A3B30;border:1.5px solid #9A3B30;border-radius:var(--radius-pill);padding:.35rem .75rem;">
                <i class="bi bi-trash3"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  // ── Filter Buttons ──
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('btn-primary', 'active');
        b.classList.add('btn-outline-primary');
      });
      btn.classList.add('btn-primary', 'active');
      btn.classList.remove('btn-outline-primary');
      currentCategory = btn.dataset.category;
      renderGallery();
    });
  });

  // ── Preview update ──
  function updatePreview(url) {
    const previewContainer = document.getElementById('photo-preview-container');
    const previewImg = document.getElementById('photo-preview-img');
    if (url) {
      previewImg.src = url;
      previewContainer.classList.remove('d-none');
    } else {
      previewContainer.classList.add('d-none');
    }
  }

  // ── Process & Compress Image on Client Side (Instant Data URL & Blob) ──
  async function processImageFile(file, maxWidth = 1400, maxHeight = 1000, quality = 0.82) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxWidth || height > maxHeight) {
            if (width / height > maxWidth / maxHeight) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            } else {
              width = Math.round((width * maxHeight) / height);
              height = maxHeight;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          canvas.toBlob(
            (blob) => resolve({ dataUrl, blob: blob || file }),
            'image/jpeg',
            quality
          );
        };
        img.onerror = () => resolve({ dataUrl: e.target.result, blob: file });
        img.src = e.target.result;
      };
      reader.onerror = () => resolve({ dataUrl: null, blob: file });
      reader.readAsDataURL(file);
    });
  }

  // ── Dropzone & File Upload ──
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('p-file-input');

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.style.background = 'var(--teal-50)';
    dropzone.style.borderColor = 'var(--teal-500)';
  });
  ['dragleave', 'dragend'].forEach(type => {
    dropzone.addEventListener(type, () => {
      dropzone.style.background = '#fff';
      dropzone.style.borderColor = 'var(--cream-300)';
    });
  });
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.style.background = '#fff';
    dropzone.style.borderColor = 'var(--cream-300)';
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      uploadFile(e.dataTransfer.files[0]);
    }
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files.length > 0) {
      uploadFile(e.target.files[0]);
      fileInput.value = '';
    }
  });

  // ── Compress & Upload File ──
  async function uploadFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      alert('Harap pilih file gambar (JPG, PNG, WEBP).');
      return;
    }

    const progressBox = document.getElementById('upload-progress-box');
    const progressBar = document.getElementById('upload-progress-bar');
    const statusText  = document.getElementById('upload-status-text');
    const statusPct   = document.getElementById('upload-status-pct');

    progressBox.classList.remove('d-none');
    progressBar.style.width = '30%';
    statusText.textContent = 'Memproses & mengompresi foto...';
    statusPct.textContent = '30%';

    // 1. Langsung proses & kompresi foto agar preview dan data URL langsung siap (<50ms)
    const { dataUrl, blob } = await processImageFile(file);
    if (dataUrl) {
      uploadedImageUrl = dataUrl;
      updatePreview(dataUrl);
    }

    progressBar.style.width = '65%';
    statusText.textContent = 'Menyimpan foto...';
    statusPct.textContent = '65%';

    // 2. Upload ke Firebase Storage dengan batas timeout agar tidak pernah macet
    try {
      const fileExt = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const cleanName = file.name.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 30);
      const storagePath = `gallery/${Date.now()}_${cleanName}.${fileExt}`;
      const fileRef = ref(storage, storagePath);

      const uploadTask = uploadBytesResumable(fileRef, blob);
      const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 4000));

      const cloudUrl = await Promise.race([
        new Promise((resolve, reject) => {
          uploadTask.on(
            'state_changed',
            (snapshot) => {
              if (snapshot.totalBytes > 0) {
                const pct = 65 + Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 30);
                progressBar.style.width = `${pct}%`;
                statusPct.textContent = `${pct}%`;
              }
            },
            (error) => reject(error),
            async () => {
              try {
                const dl = await getDownloadURL(uploadTask.snapshot.ref);
                resolve(dl);
              } catch (e) {
                reject(e);
              }
            }
          );
        }),
        timeoutPromise
      ]);

      if (cloudUrl) {
        uploadedImageUrl = cloudUrl;
        updatePreview(cloudUrl);
      }
    } catch (err) {
      console.warn('Storage background notice (data URL fallback aktif):', err);
    } finally {
      progressBar.style.width = '100%';
      statusPct.textContent = '100%';
      statusText.textContent = 'Foto siap disimpan!';
      setTimeout(() => {
        progressBox.classList.add('d-none');
        progressBar.style.width = '0%';
      }, 600);
    }
  }

  // ── Tambah Foto ──
  document.getElementById('add-photo-btn').addEventListener('click', () => {
    document.getElementById('photo-modal-title').textContent = 'Tambah Foto Galeri';
    document.getElementById('photo-form').reset();
    document.getElementById('photo-doc-id').value = '';
    uploadedImageUrl = '';
    updatePreview('');
    document.getElementById('upload-progress-box').classList.add('d-none');
    photoModal.show();
  });

  // ── Edit Foto ──
  window.editPhoto = (id) => {
    const photo = allPhotos.find(p => p.id === id);
    if (!photo) return;

    document.getElementById('photo-modal-title').textContent = 'Edit Foto Galeri';
    document.getElementById('photo-doc-id').value = photo.id;
    document.getElementById('p-title').value = photo.title || '';
    document.getElementById('p-category').value = photo.category || 'kamar';
    uploadedImageUrl = photo.imageUrl || '';
    updatePreview(uploadedImageUrl);
    photoModal.show();
  };

  // ── Simpan Foto ke Firestore ──
  document.getElementById('save-photo-btn').addEventListener('click', async () => {
    const docId    = document.getElementById('photo-doc-id').value;
    const title    = document.getElementById('p-title').value.trim();
    const category = document.getElementById('p-category').value;
    const imageUrl = uploadedImageUrl;

    if (!title || !imageUrl) {
      alert('Judul dan Foto wajib diisi/diunggah.');
      return;
    }

    const saveBtn = document.getElementById('save-photo-btn');
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Menyimpan...';

    const data = {
      title,
      category,
      imageUrl,
      updatedAt: serverTimestamp()
    };

    try {
      if (docId) {
        await updateDoc(doc(db, 'gallery', docId), data);
      } else {
        data.createdAt = serverTimestamp();
        await addDoc(collection(db, 'gallery'), data);
      }
      photoModal.hide();
    } catch (e) {
      console.error(e);
      alert('Gagal menyimpan foto ke database. Coba lagi.');
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerHTML = 'Simpan Foto';
    }
  });

  // ── Hapus Foto ──
  window.deletePhoto = (id, title) => {
    deleteId = id;
    document.getElementById('delete-photo-title').textContent = `"${title}"`;
    deleteModal.show();
  };

  document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
    if (!deleteId) return;
    try {
      await deleteDoc(doc(db, 'gallery', deleteId));
      deleteModal.hide();
    } catch (e) {
      console.error(e);
      alert('Gagal menghapus foto. Coba lagi.');
    }
  });
</script>

</body>
</html>

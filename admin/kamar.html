<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelola Kamar — Admin Teduh Residence</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../img/logo/favicon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/custom.css" />
</head>
<body>

<!-- SIDEBAR -->
<aside class="admin-sidebar d-none d-lg-flex flex-column">
  <a href="../index.html" class="brand d-flex align-items-center gap-2" target="_blank" rel="noopener">
    <img src="../img/logo/favicon.png" alt="Teduh Residence Logo" style="height:24px;width:auto;" />
    <span>Teduh Residence</span>
  </a>
  <nav class="flex-grow-1">
    <a href="index.html" class="nav-link"><i class="bi bi-calendar-check"></i>Booking</a>
    <a href="kamar.html" class="nav-link active"><i class="bi bi-door-open"></i>Kamar</a>
  </nav>
  <button id="logout-btn" class="nav-link text-start border-0 bg-transparent w-100" style="color:var(--teal-300);font-size:.9rem;padding:.6rem .75rem;cursor:pointer;">
    <i class="bi bi-box-arrow-left me-2"></i>Keluar
  </button>
</aside>

<!-- MAIN -->
<main class="admin-main">
  <div class="admin-topbar">
    <h5 class="mb-0" style="font-size:1rem;">Kelola Kamar</h5>
    <button class="btn btn-primary btn-sm" id="add-room-btn">
      <i class="bi bi-plus-lg me-1"></i>Tambah Kamar
    </button>
  </div>

  <div class="admin-content">

    <!-- Grid kamar -->
    <div class="row g-3" id="rooms-admin-grid">
      <div class="col-12 text-center py-5 text-ink-muted">
        <span class="spinner-border spinner-border-sm me-2"></span>Memuat data kamar…
      </div>
    </div>

  </div>
</main>

<!-- MODAL TAMBAH/EDIT KAMAR -->
<div class="modal fade" id="roomModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content" style="background:var(--cream-50);border:1px solid var(--cream-300);border-radius:var(--radius-lg);">
      <div class="modal-header" style="border-bottom:1px solid var(--cream-300);">
        <h5 class="modal-title" id="room-modal-title">Tambah Kamar</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="room-form" novalidate>
          <input type="hidden" id="room-doc-id" />
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nama Kamar *</label>
              <input type="text" class="form-control" id="r-name" required placeholder="Kamar Deluxe" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Harga/Malam (Rp) *</label>
              <input type="number" class="form-control" id="r-price" required min="0" placeholder="450000" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Kapasitas Tamu *</label>
              <input type="number" class="form-control" id="r-capacity" required min="1" max="10" placeholder="2" />
            </div>
            <div class="col-12">
              <label class="form-label">Deskripsi</label>
              <textarea class="form-control" id="r-desc" rows="2" placeholder="Deskripsi singkat kamar..." style="height:auto;min-height:auto;"></textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Fasilitas (pisahkan dengan koma)</label>
              <input type="text" class="form-control" id="r-facilities" placeholder="AC, Wi-Fi, Sarapan, TV" />
            </div>
            <div class="col-12">
              <label class="form-label">URL Foto (pisahkan dengan koma)</label>
              <input type="text" class="form-control" id="r-images" placeholder="https://..." />
              <div class="form-text" style="color:var(--ink-muted);font-size:.8rem;">Foto pertama akan ditampilkan sebagai foto utama kamar.</div>
            </div>
            <div class="col-12">
              <div class="form-check" style="padding-left:0;">
                <input type="checkbox" class="form-check-input" id="r-available" checked style="margin-left:0;margin-right:.5rem;" />
                <label class="form-check-label" for="r-available" style="font-size:.9375rem;">Kamar tersedia untuk dibooking</label>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer" style="border-top:1px solid var(--cream-300);">
        <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary" id="save-room-btn">Simpan Kamar</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL KONFIRMASI HAPUS -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content" style="background:var(--cream-50);border-radius:var(--radius-lg);border:1px solid var(--cream-300);">
      <div class="modal-body text-center p-4">
        <i class="bi bi-exclamation-triangle" style="font-size:2rem;color:#B08D57;"></i>
        <h5 class="mt-3 mb-2">Hapus kamar?</h5>
        <p class="text-ink-muted mb-4" style="font-size:.875rem;">Kamar <strong id="delete-room-name"></strong> akan dihapus. Tindakan ini tidak dapat dibatalkan.</p>
        <div class="d-flex gap-2 justify-content-center">
          <button class="btn btn-outline-primary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-primary" id="confirm-delete-btn" style="--bs-btn-bg:#9A3B30;--bs-btn-border-color:#9A3B30;--bs-btn-hover-bg:#7a2e24;--bs-btn-hover-border-color:#7a2e24;">Hapus</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { auth, db } from '../js/firebase.js';
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, orderBy, query
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  onAuthStateChanged(auth, (user) => {
    if (!user) window.location.href = 'login.html';
    else loadRooms();
  });

  document.getElementById('logout-btn')?.addEventListener('click', () => {
    signOut(auth).then(() => window.location.href = 'login.html');
  });

  const roomModal   = new bootstrap.Modal(document.getElementById('roomModal'));
  const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
  let allRooms = [];
  let deleteId = null;

  // ── Load rooms ──
  function loadRooms() {
    const q = query(collection(db, 'rooms'), orderBy('name'));
    onSnapshot(q, (snap) => {
      allRooms = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderRooms();
    });
  }

  // ── Render grid ──
  function renderRooms() {
    const grid = document.getElementById('rooms-admin-grid');
    if (allRooms.length === 0) {
      grid.innerHTML = `<div class="col-12 text-center py-5 text-ink-muted">Belum ada kamar. Klik "Tambah Kamar" untuk memulai.</div>`;
      return;
    }
    grid.innerHTML = allRooms.map(r => `
      <div class="col-md-6 col-lg-4">
        <div class="card h-100">
          <div style="aspect-ratio:16/9;overflow:hidden;border-radius:var(--radius-lg) var(--radius-lg) 0 0;">
            <img src="${r.images?.[0] || 'https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=500'}"
                 alt="${r.name}" style="width:100%;height:100%;object-fit:cover;" loading="lazy" />
          </div>
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <h5 class="mb-0" style="font-size:1rem;">${r.name}</h5>
              <span class="${r.isAvailable !== false ? 'badge-confirmed' : 'badge-cancelled'}">
                ${r.isAvailable !== false ? 'Tersedia' : 'Tidak Tersedia'}
              </span>
            </div>
            <p class="text-ink-muted mb-1" style="font-size:.875rem;">
              Rp ${Number(r.pricePerNight).toLocaleString('id-ID')} / malam · ${r.capacity} tamu
            </p>
            <p class="text-ink-muted mb-3" style="font-size:.8rem;">${(r.facilities || []).join(' · ')}</p>
            <div class="d-flex gap-2">
              <button class="btn btn-outline-primary btn-sm" onclick="editRoom('${r.id}')">
                <i class="bi bi-pencil me-1"></i>Edit
              </button>
              <button class="btn btn-outline-primary btn-sm" onclick="toggleAvailable('${r.id}', ${r.isAvailable !== false})">
                <i class="bi bi-${r.isAvailable !== false ? 'eye-slash' : 'eye'} me-1"></i>
                ${r.isAvailable !== false ? 'Nonaktifkan' : 'Aktifkan'}
              </button>
              <button class="btn btn-sm" onclick="deleteRoom('${r.id}', '${r.name}')"
                      style="color:#9A3B30;border:1.5px solid #9A3B30;border-radius:var(--radius-pill);padding:.4rem .85rem;">
                <i class="bi bi-trash3"></i>
              </button>
            </div>
          </div>
        </div>
      </div>`).join('');
  }

  // ── Tambah kamar ──
  document.getElementById('add-room-btn').addEventListener('click', () => {
    document.getElementById('room-modal-title').textContent = 'Tambah Kamar';
    document.getElementById('room-form').reset();
    document.getElementById('room-doc-id').value = '';
    document.getElementById('r-available').checked = true;
    roomModal.show();
  });

  // ── Edit kamar ──
  window.editRoom = (id) => {
    const r = allRooms.find(x => x.id === id);
    if (!r) return;
    document.getElementById('room-modal-title').textContent = 'Edit Kamar';
    document.getElementById('room-doc-id').value   = r.id;
    document.getElementById('r-name').value        = r.name || '';
    document.getElementById('r-price').value       = r.pricePerNight || '';
    document.getElementById('r-capacity').value    = r.capacity || '';
    document.getElementById('r-desc').value        = r.description || '';
    document.getElementById('r-facilities').value  = (r.facilities || []).join(', ');
    document.getElementById('r-images').value      = (r.images || []).join(', ');
    document.getElementById('r-available').checked = r.isAvailable !== false;
    roomModal.show();
  };

  // ── Simpan kamar ──
  document.getElementById('save-room-btn').addEventListener('click', async () => {
    const id       = document.getElementById('room-doc-id').value;
    const name     = document.getElementById('r-name').value.trim();
    const price    = parseFloat(document.getElementById('r-price').value);
    const capacity = parseInt(document.getElementById('r-capacity').value);

    if (!name || isNaN(price) || isNaN(capacity)) {
      alert('Nama, harga, dan kapasitas wajib diisi.');
      return;
    }

    const data = {
      name,
      pricePerNight: price,
      capacity,
      description:  document.getElementById('r-desc').value.trim(),
      facilities:   document.getElementById('r-facilities').value.split(',').map(s => s.trim()).filter(Boolean),
      images:       document.getElementById('r-images').value.split(',').map(s => s.trim()).filter(Boolean),
      isAvailable:  document.getElementById('r-available').checked,
    };

    try {
      if (id) {
        await updateDoc(doc(db, 'rooms', id), data);
      } else {
        await addDoc(collection(db, 'rooms'), data);
      }
      roomModal.hide();
    } catch (e) {
      alert('Gagal menyimpan. Coba lagi.');
    }
  });

  // ── Toggle tersedia ──
  window.toggleAvailable = async (id, current) => {
    await updateDoc(doc(db, 'rooms', id), { isAvailable: !current });
  };

  // ── Hapus kamar ──
  window.deleteRoom = (id, name) => {
    deleteId = id;
    document.getElementById('delete-room-name').textContent = name;
    deleteModal.show();
  };

  document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
    if (!deleteId) return;
    try {
      await deleteDoc(doc(db, 'rooms', deleteId));
      deleteModal.hide();
    } catch (e) {
      alert('Gagal menghapus. Coba lagi.');
    }
  });
</script>

</body>
</html>

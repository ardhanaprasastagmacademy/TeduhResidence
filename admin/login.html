<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin — Teduh Residence</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../img/logo/favicon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/custom.css" />
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--teal-900); }
    .login-card { width: 100%; max-width: 420px; background: var(--cream-50); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: 0 24px 60px -10px rgba(14,59,58,.5); }
    .login-brand { font-size: 1.5rem; font-weight: 500; color: var(--teal-900); margin-bottom: .25rem; display: flex; align-items: center; gap: .6rem; }
    .login-sub { font-size: .875rem; color: var(--ink-muted); margin-bottom: 2rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <img src="../img/logo/favicon.png" alt="Teduh Residence Logo" style="height:34px;width:auto;" />
      <span>Teduh Residence</span>
    </div>
    <div class="login-sub">Panel Admin · Masuk untuk melanjutkan</div>

    <div id="login-error" class="d-none mb-4 p-3" style="background:var(--cream-200);border-left:3px solid #9A3B30;border-radius:var(--radius-md);color:#9A3B30;font-size:.875rem;">
      Email atau kata sandi salah. Coba lagi.
    </div>

    <form id="login-form" novalidate>
      <div class="mb-4">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="admin@teduhresidence.com" required autocomplete="email" />
      </div>
      <div class="mb-5">
        <label for="password" class="form-label">Kata Sandi</label>
        <div class="position-relative">
          <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password" style="padding-right:3rem;" />
          <button type="button" id="toggle-pw" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ink-muted);cursor:pointer;padding:0;font-size:1rem;" aria-label="Tampilkan kata sandi">
            <i class="bi bi-eye" id="pw-icon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg" id="login-btn">
        <span id="login-text">Masuk</span>
        <span id="login-loading" class="d-none"><span class="spinner-border spinner-border-sm me-2" role="status"></span>Memverifikasi…</span>
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { auth } from '../js/firebase.js';
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Redirect jika sudah login
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = 'index.html';
    });

    const form      = document.getElementById('login-form');
    const loginBtn  = document.getElementById('login-btn');
    const loginText = document.getElementById('login-text');
    const loginLoad = document.getElementById('login-loading');
    const errEl     = document.getElementById('login-error');
    const togglePw  = document.getElementById('toggle-pw');
    const pwInput   = document.getElementById('password');
    const pwIcon    = document.getElementById('pw-icon');

    // Toggle password visibility
    togglePw?.addEventListener('click', () => {
      const isText = pwInput.type === 'text';
      pwInput.type = isText ? 'password' : 'text';
      pwIcon.className = isText ? 'bi bi-eye' : 'bi bi-eye-slash';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.add('d-none');
      loginBtn.disabled = true;
      loginText.classList.add('d-none');
      loginLoad.classList.remove('d-none');

      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById('email').value,
          document.getElementById('password').value
        );
        window.location.href = 'index.html';
      } catch {
        errEl.classList.remove('d-none');
      } finally {
        loginBtn.disabled = false;
        loginText.classList.remove('d-none');
        loginLoad.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
